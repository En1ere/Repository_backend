services:
  db:
    image: postgres:17
    container_name: nest-rep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_rep
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nest_rep:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d nest_rep",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repository_backend_postgres_data:
    name: nest_rep